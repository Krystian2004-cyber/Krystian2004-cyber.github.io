<html lang="pl">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg-body: #f8fafc;
  --bg-card: #ffffff;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --border-color: #e2e8f0;
  
  --success-bg: #f0fdf4;
  --success-border: #22c55e;
  --success-text: #166534;
  
  --error-bg: #fff1f2;
  --error-border: #f43f5e;
  --error-text: #9f1239;
  
  --info-bg: #f0f9ff;
  --info-border: #0ea5e9;
  --info-text: #0369a1;
  
  --border-radius-sm: 8px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-body);
  color: var(--text-primary);
  line-height: 1.6;
  padding: 2rem 1rem;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  background: var(--bg-card);
  padding: 1rem;
  border-radius: var(--border-radius-md);
  border: 1px solid var(--border-color);
  box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
}

.mode-btn {
  padding: 10px 20px;
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius-sm);
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s ease;
}

.mode-btn:hover {
  background: #f1f5f9;
  color: var(--text-primary);
}

.mode-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.progress {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-left: auto;
}

.shuffle-badge {
  font-size: 12px;
  font-weight: 500;
  color: #b45309;
  background: #fef3c7;
  padding: 4px 12px;
  border-radius: 20px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius-lg);
  padding: 2.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
}

.q-num {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.q-text {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 1.75rem;
  color: var(--text-primary);
}

.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius-md);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 15px;
  color: var(--text-primary);
  margin-bottom: 10px;
  transition: all 0.15s ease;
  line-height: 1.4;
}

.option:hover:not(:disabled) {
  background: #f8fafc;
  border-color: #cbd5e1;
  transform: translateY(-1px);
}

.option:disabled {
  cursor: not-allowed;
}

.option.selected {
  border-color: var(--primary);
  background: #eef2ff;
}

.option.correct {
  background: var(--success-bg) !important;
  border-color: var(--success-border) !important;
  color: var(--success-text) !important;
  font-weight: 500;
}

.option.wrong {
  background: var(--error-bg) !important;
  border-color: var(--error-border) !important;
  color: var(--error-text) !important;
}

.q-meta {
  font-size: 13px;
  font-weight: 600;
  color: #6366f1;
  margin-bottom: 8px;
}

.explanation {
  margin-top: 1.5rem;
  padding: 16px 20px;
  background: var(--info-bg);
  border-radius: var(--border-radius-md);
  font-size: 14px;
  color: var(--info-text);
  line-height: 1.6;
  border-left: 4px solid var(--info-border);
}

.nav-row {
  display: flex;
  gap: 12px;
  margin-top: 1.75rem;
  align-items: center;
  justify-content: flex-end;
}

.nav-btn {
  padding: 12px 24px;
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius-sm);
  background: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s;
}

.nav-btn:hover {
  background: #f1f5f9;
}

.nav-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.nav-btn.primary:hover {
  background: var(--primary-hover);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);

.score-card {
  text-align: center;
  padding: 3.5rem 2rem;
}

.score-big {
  font-size: 56px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}

.score-sub {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-primary);
  margin-top: 12px;
  margin-bottom: 2rem;
}

.restart-btn {
  padding: 12px 28px;
  border: 1px solid var(--primary);
  border-radius: var(--border-radius-sm);
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  transition: all 0.2s;
}

.restart-btn:hover {
  background: var(--primary);
  color: white;
}
</style>
</head>

      "b.  Właściwości statystyczne szeregu (takie jak średnia i wariancja) nie zmieniają się w czasie",
      "c.  Szereg rośnie w sposób liniowy w nieskończoność",
      "d.  Wartości szeregu są zawsze stałe i równe zero"
    ],
    "ans": [
      1
    ],
    "exp": ""
  },
  {
    "q": "Zadanie 84 — Który z poniższych indeksów/miar służy do oceny jakości klasteryzacji (uczenie nienadzorowane) bez znajomości prawdziwych etykiet klas?",
    "opts": [
      "a.  Indeks Rand (Rand Index)",
      "b.  Współczynnik Sylwetki (Silhouette Coefficient)",
      "c.  Macierz pomyłek (Confusion Matrix)",
      "d.  F1-score"
    ],
    "ans": [
      1
    ],
    "exp": ""
  },
  {
    "q": "Zadanie 85 — W algorytmie AdaBoost (Adaptive Boosting) w każdej kolejnej iteracji:",
    "opts": [
      "a.  Zmniejsza się wagę próbek, które zostały błędnie sklasyfikowane przez poprzedni klasyfikator",
      "b.  Zwiększa się wagę próbek, które zostały błędnie sklasyfikowane przez poprzedni klasyfikator",
      "c.  Losowo odrzuca się połowę zbioru danych",
      "d.  Zwiększa się współczynnik uczenia (learning rate) dwukrotnie"
    ],
    "ans": [
      1
    ],
    "exp": ""
  }
];

let mode='learn', questions=[], idx=0, answered=false, score=0, testAnswers=[], selectedIndices=[];

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function setMode(m){
  mode=m;
  document.getElementById('btn-learn').classList.toggle('active',m==='learn');
  document.getElementById('btn-test').classList.toggle('active',m==='test');
  document.getElementById('btn-list').classList.toggle('active',m==='list');
  initQuiz();
}

function initQuiz(){
  idx=0; answered=false; score=0; testAnswers=[]; selectedIndices=[];
  if(mode==='learn'){
    questions=shuffle([...ALL_Q]);
    document.getElementById('shuffle-info').textContent='Losowa kolejność';
    render();
  } else if(mode==='test'){
    questions=shuffle([...ALL_Q]).slice(0,30);
    document.getElementById('shuffle-info').textContent='30 losowych pytań';
    render();
  } else {
    questions=[...ALL_Q];
    document.getElementById('shuffle-info').textContent='Wszystkie pytania';
    renderList();
  }
}

function render(){
  if(idx>=questions.length){renderResult();return;}
  const q=questions[idx];
  updateProgress();
  selectedIndices=[];
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  const card=document.createElement('div');
  card.className='card';
  
  const correctCount = Array.isArray(q.ans) ? q.ans.length : 1;
  card.innerHTML=`<div class="q-num">Pytanie ${idx+1} z ${questions.length}</div>
                  <div class="q-meta">Poprawne odpowiedzi: ${correctCount}</div>
                  <div class="q-text">${q.q}</div>`;
  
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='option';
    btn.textContent=o;
    btn.onclick=()=>toggleOption(i);
    btn.id='opt'+i;
    card.appendChild(btn);
  });
  const exp=document.createElement('div');
  exp.className='explanation';
  exp.id='explanation';
  exp.style.display='none';
  card.appendChild(exp);
  const nav=document.createElement('div');
  nav.className='nav-row';
  nav.id='nav-row';
  
  if(mode==='learn') {
    const checkBtn=document.createElement('button');
    checkBtn.className='nav-btn primary';
    checkBtn.textContent='Sprawdź';
    checkBtn.id='check-btn';
    checkBtn.onclick=()=>checkAnswer();
    nav.appendChild(checkBtn);
  } else if(mode==='test') {
    const nextBtn=document.createElement('button');
    nextBtn.className='nav-btn primary';
    nextBtn.textContent='Dalej →';
    nextBtn.onclick=()=>nextTestQuestion();
    nav.appendChild(nextBtn);
  }
  
  card.appendChild(nav);
  area.appendChild(card);
}

function toggleOption(i){
  if(answered) return;
  const idxInSelected = selectedIndices.indexOf(i);
  if(idxInSelected > -1){
    selectedIndices.splice(idxInSelected, 1);
    document.getElementById('opt'+i).classList.remove('selected');
  } else {
    selectedIndices.push(i);
    document.getElementById('opt'+i).classList.add('selected');
  }
}

function nextTestQuestion(){
  testAnswers[idx] = [...selectedIndices];
  idx++;
  render();
}

function checkAnswer(){
  if(answered) return;
  answered=true;
  const q=questions[idx];
  const correctAns = Array.isArray(q.ans) ? q.ans : [q.ans];
  
  // Calculate score: all selected must be correct AND all correct must be selected
  const isFullyCorrect = selectedIndices.length === correctAns.length && 
                         selectedIndices.every(val => correctAns.includes(val));
  
  if(isFullyCorrect) score++;
  
  q.opts.forEach((_,i)=>{
    const btn=document.getElementById('opt'+i);
    btn.disabled=true;
    const isThisCorrect = correctAns.includes(i);
    const isThisSelected = selectedIndices.includes(i);
    
    if(isThisCorrect) btn.classList.add('correct');
    else if(isThisSelected) btn.classList.add('wrong');
  });
  
  document.getElementById('check-btn').style.display='none';
  const exp=document.getElementById('explanation');
  exp.style.display='block';
  exp.textContent=q.exp || "Brak dodatkowego wyjaśnienia.";
  const nav=document.getElementById('nav-row');
  const nextBtn=document.createElement('button');
  nextBtn.className='nav-btn primary';
  nextBtn.textContent=idx+1<questions.length?'Następne →':'Zakończ';
  nextBtn.onclick=()=>{answered=false;idx++;render();};
  nav.appendChild(nextBtn);
}

function renderList(){
  updateProgress();
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  questions.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='card';
    const correctAns = Array.isArray(q.ans) ? q.ans : [q.ans];
    card.innerHTML=`<div class="q-num">Pytanie ${i+1}</div>
                    <div class="q-meta">Poprawne odpowiedzi: ${correctAns.length}</div>
                    <div class="q-text">${q.q}</div>`;
    q.opts.forEach((o,j)=>{
      const p=document.createElement('div');
      p.style.cssText='padding:12px 16px;border-radius:var(--border-radius-md);margin-bottom:8px;font-size:14px;line-height:1.4;border:1px solid #e2e8f0;';
      if(correctAns.includes(j)) {
        p.style.background='#f0fdf4';
        p.style.borderColor='#22c55e';
        p.style.color='#166534';
        p.style.fontWeight='500';
      }
      p.textContent=o;
      card.appendChild(p);
    });
    if(q.exp){
      const exp=document.createElement('div');
      exp.className='explanation';
      exp.textContent=q.exp;
      card.appendChild(exp);
    }
    area.appendChild(card);
  });
}

function renderResult(){
  updateProgress();
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  if(mode==='learn'){
    const card=document.createElement('div');
    card.className='card score-card';
    const pct=Math.round(score/questions.length*100);
    card.innerHTML=`<div class="score-big">${score}/${questions.length}</div><div class="score-sub">${pct}% poprawnych odpowiedzi</div><button class="restart-btn" onclick="initQuiz()">Losuj ponownie</button>`;
    area.appendChild(card);
  } else {
    let correct=0;
    testAnswers.forEach((selected, i)=>{
      const correctAns = Array.isArray(questions[i].ans) ? questions[i].ans : [questions[i].ans];
      const isFullyCorrect = selected.length === correctAns.length && 
                             selected.every(val => correctAns.includes(val));
      if(isFullyCorrect) correct++;
    });
    const pct=Math.round(correct/questions.length*100);
    const card=document.createElement('div');
    card.className='card score-card';
    card.innerHTML=`<div class="score-big">${correct}/${questions.length}</div><div class="score-sub">${pct}% — ${pct>=60?'✓ Zaliczone':'✗ Niezaliczone (próg 60%)'}</div>`;
    
    const reviewBtn=document.createElement('button');
    reviewBtn.className='restart-btn';
    reviewBtn.textContent='Przejrzyj odpowiedzi';
    reviewBtn.onclick=()=>renderReview();
    card.appendChild(reviewBtn);
    
    const againBtn=document.createElement('button');
    againBtn.className='restart-btn';
    againBtn.style.marginLeft='8px';
    againBtn.textContent='Nowy test';
    againBtn.onclick=()=>initQuiz();
    card.appendChild(againBtn);
    
    area.appendChild(card);
  }
}

function renderReview(){
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  questions.forEach((q,i)=>{
    const selected=testAnswers[i] || [];
    const correctAns = Array.isArray(q.ans) ? q.ans : [q.ans];
    const ok = selected.length === correctAns.length && 
               selected.every(val => correctAns.includes(val));
    const card=document.createElement('div');
    card.className='card';
    card.style.borderLeft=ok?'4px solid #22c55e':'4px solid #f43f5e';
    card.innerHTML=`<div class="q-num">Pytanie ${i+1} ${ok?'✓':'✗'}</div><div class="q-text">${q.q}</div>`;
    q.opts.forEach((o,j)=>{
      const p=document.createElement('div');
      p.style.cssText='padding:12px 16px;border-radius:var(--border-radius-md);margin-bottom:8px;font-size:14px;line-height:1.4;border:1px solid #e2e8f0;';
      const isThisCorrect = correctAns.includes(j);
      const isThisSelected = selected.includes(j);
      if(isThisCorrect) {
        p.style.background='#f0fdf4';
        p.style.borderColor='#22c55e';
        p.style.color='#166534';
        p.style.fontWeight='500';
      }
      else if(isThisSelected && !isThisCorrect) {
        p.style.background='#fff1f2';
        p.style.borderColor='#f43f5e';
        p.style.color='#9f1239';
      }
      p.textContent=o;
      card.appendChild(p);
    });
    const exp=document.createElement('div');
    exp.className='explanation';
    exp.textContent=q.exp || "Brak dodatkowego wyjaśnienia.";
    card.appendChild(exp);
    area.appendChild(card);
  });
  const backBtn=document.createElement('button');
  backBtn.className='nav-btn primary';
  backBtn.textContent='Nowy test';
  backBtn.onclick=()=>initQuiz();
  backBtn.style.marginTop='1rem';
  area.appendChild(backBtn);
}

function updateProgress(){
  const progressText = mode==='list' ? `Lista: ${questions.length} pytań` : 
                       (mode==='learn' ? `${idx}/${questions.length} przejrzanych` : `${Math.min(idx,questions.length)}/${questions.length}`);
  document.getElementById('progress').textContent=progressText;
}

initQuiz();
</script>
</body>
</html>
