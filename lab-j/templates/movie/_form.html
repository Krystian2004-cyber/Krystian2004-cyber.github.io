<div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ movie.title if movie.title else '' }}">
</div>

<div class="form-group">
    <label for="director">Director</label>
    <input type="text" id="director" name="director" value="{{ movie.director if movie.director else '' }}">
</div>

<div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="year" name="year" value="{{ movie.year if movie.year else '' }}">
</div>

<div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" name="description">{{ movie.description if movie.description else '' }}</textarea>
</div>

<div class="form-group">
    <label for="rating">Rating</label>
    <input type="number" id="rating" name="rating" min="1" max="10" value="{{ movie.rating if movie.rating else '' }}">
</div>

<div class="form-group">
    <label></label>
    <input type="submit" value="{{ button_label if button_label else 'Submit' }}">
</div>
