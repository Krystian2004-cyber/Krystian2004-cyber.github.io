{% extends 'base.html' %}

{% block content %}
<h1>Edit Movie</h1>

<form method="post" action="{{ url_for('movie_edit', movie_id=movie.id) }}" class="edit-form">
    {% set button_label = 'Update' %}
    {% include 'movie/_form.html' %}
</form>

<ul class="action-list">
    <li><a href="{{ url_for('movies_list') }}">Back to list</a></li>
    <li>
        <form method="post" action="{{ url_for('movie_delete', movie_id=movie.id) }}" onsubmit="return confirm('Are you sure you want to delete this item?');" style="display: inline;">
            <button type="submit" style="background: none; border: none; padding: 0; color: #484848; font: inherit; cursor: pointer; text-decoration: none;">Delete</button>
        </form>
    </li>
</ul>
{% endblock %}
